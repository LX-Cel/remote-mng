name: Build standalone personal releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv sync --frozen --group bundle
      - run: uv run --frozen pytest -q
      - id: build_bundle
        run: uv run --frozen python scripts/build_release.py
      - run: uv run --frozen python scripts/smoke_release.py --build-result dist/release/build-result.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.build_bundle.outcome == 'success'
        with:
          name: remote-mng-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/release/*.zip
            dist/release/*.sha256
            dist/release/build-result.json

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish pinned private-repository assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/*.zip artifacts/*.sha256 --verify-tag --generate-notes
